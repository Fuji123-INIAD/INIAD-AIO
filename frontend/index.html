<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INIAD-AIO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">INIAD Assistant</p>
      <h1>INIAD-AIO</h1>
      <p class="subtitle">v0.3 Task List Demo: 授業ルールに基づく課題候補を確認できます。</p>
      <p class="demo-notice">この課題一覧は授業ルールに基づく課題候補です。実際の提出期限・提出場所はMOOCsも確認してください。</p>
    </section>

    <section class="card task-card">
      <div class="task-card-header">
        <div>
          <p class="eyebrow task-eyebrow">Rule Tasks</p>
          <h2 class="section-title task-title">課題一覧</h2>
        </div>
        <div id="taskSummary" class="task-summary">読み込み中...</div>
      </div>
      <div id="taskWarnings" class="task-warnings"></div>
      <div id="taskError" class="task-error"></div>
      <div id="taskList" class="task-list"></div>
    </section>

    <section class="card question-card" hidden>
      <label class="section-title" for="question">質問</label>
      <textarea id="question" rows="8" placeholder="質問を入力してください"></textarea>
      <div class="actions">
        <p class="hint">AI回答</p>
        <button id="sendButton" onclick="ask()">送信</button>
      </div>
    </section>

    <details class="card search-card" hidden>
      <summary class="search-summary">詳細検索</summary>
      <div class="search-panel">
        <label class="section-title" for="searchQuery">検索</label>
        <div class="search-row">
          <input id="searchQuery" type="search" placeholder="課題 / COT101 / exercise">
          <button id="searchButton" onclick="searchMoocs()">検索</button>
        </div>
        <div id="searchStatus" class="status-line"></div>
        <div id="searchResults" class="sources"></div>
      </div>
    </details>

    <section class="card answer-card" hidden>
      <h2 class="section-title">AI回答</h2>
      <pre id="answer">ここに回答が表示されます。</pre>
      <h3 class="sources-title answer-sources-title">参照データ</h3>
      <div id="sources" class="sources"></div>
    </section>
  </main>

  <footer>
    INIAD-AIO Prototype
  </footer>

  <script>
    const sendButton = document.getElementById("sendButton");
    const questionInput = document.getElementById("question");
    const answerArea = document.getElementById("answer");
    const sourcesArea = document.getElementById("sources");
    const searchButton = document.getElementById("searchButton");
    const searchQueryInput = document.getElementById("searchQuery");
    const searchStatus = document.getElementById("searchStatus");
    const searchResultsArea = document.getElementById("searchResults");
    const taskSummary = document.getElementById("taskSummary");
    const taskWarnings = document.getElementById("taskWarnings");
    const taskError = document.getElementById("taskError");
    const taskList = document.getElementById("taskList");
    const ruleTaskQuery = "course_code=COT101&course_code=SEM101&course_code=COT105";

    loadTaskList();

    async function ask() {
      const question = questionInput.value;

      if (!question.trim()) {
        answerArea.textContent = "質問を入力してください。";
        return;
      }

      answerArea.textContent = "送信中...";
      answerArea.classList.add("is-loading");
      sourcesArea.textContent = "";
      sendButton.disabled = true;

      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question: question })
        });

        const data = await response.json();

        if (data.answer) {
          answerArea.textContent = data.answer;
        } else if (data.error) {
          answerArea.textContent = "エラー: " + data.error;
        } else {
          answerArea.textContent = "";
        }

        renderSources(data.sources, sourcesArea, null);
      } catch (error) {
        answerArea.textContent = "通信エラー: " + error.message;
      } finally {
        answerArea.classList.remove("is-loading");
        sendButton.disabled = false;
      }
    }

    async function searchMoocs() {
      const query = searchQueryInput.value.trim();

      if (!query) {
        searchStatus.textContent = "検索語を入力してください。";
        searchResultsArea.textContent = "";
        return;
      }

      searchStatus.textContent = "検索中...";
      searchResultsArea.textContent = "";
      searchButton.disabled = true;

      try {
        const params = new URLSearchParams({ q: query, limit: "12" });
        const response = await fetch("/api/search?" + params.toString());
        const data = await response.json();

        if (data.status !== "ok") {
          searchStatus.textContent = "エラー: " + (data.detail || "search failed");
          return;
        }

        searchStatus.textContent = data.results.length + "件";
        renderSources(data.results, searchResultsArea, "検索結果");
      } catch (error) {
        searchStatus.textContent = "通信エラー: " + error.message;
      } finally {
        searchButton.disabled = false;
      }
    }

    async function loadTaskList() {
      taskSummary.textContent = "読み込み中...";
      taskWarnings.textContent = "";
      taskError.textContent = "";
      taskList.textContent = "";

      try {
        const response = await fetch("/api/tasks?" + ruleTaskQuery);
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        renderTaskList(data);
      } catch (error) {
        taskSummary.textContent = "取得失敗";
        taskError.textContent = "課題一覧を取得できませんでした: " + error.message;
      }
    }

    function renderTaskList(data) {
      const items = Array.isArray(data.items) ? data.items : [];
      const warnings = Array.isArray(data.warnings) ? data.warnings : [];

      taskSummary.textContent = items.length + "件 / active " + (data.active_count || 0);
      taskList.textContent = "";
      taskWarnings.textContent = "";

      if (warnings.length > 0) {
        const warningList = document.createElement("ul");
        warningList.className = "task-warning-list";
        warnings.forEach(function(warning) {
          const item = document.createElement("li");
          item.textContent = (warning.course_code || "unknown") + ": " + (warning.message || "warning");
          warningList.appendChild(item);
        });
        taskWarnings.appendChild(warningList);
      }

      if (items.length === 0) {
        const empty = document.createElement("p");
        empty.className = "task-empty";
        empty.textContent = "表示できる課題はありません。";
        taskList.appendChild(empty);
        return;
      }

      const table = document.createElement("table");
      table.className = "task-table";

      const head = document.createElement("thead");
      const headRow = document.createElement("tr");
      ["科目", "区分", "やること", "期限", "開く", "状態", "根拠"].forEach(function(label) {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = label;
        headRow.appendChild(cell);
      });
      head.appendChild(headRow);
      table.appendChild(head);

      const tableBody = document.createElement("tbody");
      items.forEach(function(task) {
        appendTaskTableRows(tableBody, task);
      });
      table.appendChild(tableBody);
      taskList.appendChild(table);
      return;

      items.forEach(function(task) {
        const row = document.createElement("article");
        row.className = "task-item" + (task.active ? " is-active" : " is-inactive");

        const shortName = document.createElement("span");
        shortName.className = "task-short-name";
        shortName.textContent = task.short_name || task.course_code || "";

        const body = document.createElement("div");
        body.className = "task-body";

        const title = document.createElement("h3");
        title.className = "task-item-title";
        title.textContent = task.title || "Untitled task";

        const meta = document.createElement("div");
        meta.className = "task-meta";
        appendTaskMeta(meta, "status", task.status || "todo");
        appendTaskMeta(meta, "active", task.active ? "true" : "false");

        const deadline = task.estimated_deadline || task.estimated_deadline_at || task.deadline || task.deadline_at || task.due_date;
        if (deadline) {
          appendTaskMeta(meta, "deadline", deadline);
        }

        const guidance = renderTaskGuidance(task);
        const evidence = renderTaskEvidence(task);

        const controls = document.createElement("div");
        controls.className = "task-controls";

        const statusLabel = document.createElement("label");
        statusLabel.className = "task-status-label";
        statusLabel.textContent = "change status";

        const statusSelect = document.createElement("select");
        statusSelect.className = "task-status-select";
        statusSelect.setAttribute("aria-label", "Change status for " + (task.title || task.id || "task"));
        ["todo", "done", "ignored"].forEach(function(status) {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;
          option.selected = status === (task.status || "todo");
          statusSelect.appendChild(option);
        });
        statusSelect.addEventListener("change", function() {
          updateTaskStatus(task.id || task.task_id, statusSelect.value, statusSelect);
        });

        controls.appendChild(statusLabel);
        controls.appendChild(statusSelect);

        body.appendChild(title);
        body.appendChild(meta);
        if (guidance) {
          body.appendChild(guidance);
        }
        if (evidence) {
          body.appendChild(evidence);
        }
        body.appendChild(controls);
        row.appendChild(shortName);
        row.appendChild(body);
        taskList.appendChild(row);
      });
    }

    function appendTaskTableRows(tableBody, task) {
      const row = document.createElement("tr");
      row.className = "task-row" + (task.active ? " is-active" : " is-inactive");

      appendTaskCell(row, "task-course-cell", task.short_name || task.course_code || "");
      appendTaskCell(row, "task-track-cell", task.track || "");
      appendTaskCell(row, "task-description-cell", task.description || task.title || "Untitled task");
      appendTaskCell(row, "task-deadline-cell", task.deadline_note || "");
      row.appendChild(createTaskPrimaryActionCell(task));

      const statusCell = document.createElement("td");
      statusCell.className = "task-status-cell";
      statusCell.appendChild(createTaskStatusSelect(task));
      row.appendChild(statusCell);

      const evidenceCell = document.createElement("td");
      evidenceCell.className = "task-evidence-cell";
      evidenceCell.appendChild(createTaskEvidenceButton(task));
      row.appendChild(evidenceCell);
      tableBody.appendChild(row);

      const detailRow = document.createElement("tr");
      detailRow.className = "task-detail-row";
      detailRow.hidden = true;
      const detailCell = document.createElement("td");
      detailCell.colSpan = 7;
      detailCell.className = "task-detail-cell";
      detailCell.appendChild(renderTaskRowDetails(task));
      detailRow.appendChild(detailCell);
      tableBody.appendChild(detailRow);
    }

    function appendTaskCell(row, className, text) {
      const cell = document.createElement("td");
      cell.className = className;
      cell.textContent = text;
      row.appendChild(cell);
    }

    function createTaskPrimaryActionCell(task) {
      const cell = document.createElement("td");
      cell.className = "task-primary-action-cell";
      if (!task.primary_action_url) {
        cell.textContent = "-";
        return cell;
      }

      const link = document.createElement("a");
      link.className = "task-primary-action-link";
      link.href = task.primary_action_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "開く";
      link.title = task.primary_action_label || task.primary_action_url;
      cell.appendChild(link);
      return cell;
    }

    function createTaskStatusSelect(task) {
      const statusSelect = document.createElement("select");
      statusSelect.className = "task-status-select";
      statusSelect.setAttribute("aria-label", "Change status for " + (task.title || task.id || "task"));
      ["todo", "done", "ignored"].forEach(function(status) {
        const option = document.createElement("option");
        option.value = status;
        option.textContent = status;
        option.selected = status === (task.status || "todo");
        statusSelect.appendChild(option);
      });
      statusSelect.addEventListener("change", function() {
        updateTaskStatus(task.id || task.task_id, statusSelect.value, statusSelect);
      });
      return statusSelect;
    }

    function createTaskEvidenceButton(task) {
      const detailButton = document.createElement("button");
      detailButton.type = "button";
      detailButton.className = "task-evidence-detail-button";
      detailButton.textContent = "details";
      detailButton.addEventListener("click", function() {
        toggleTaskDetails(task, detailButton);
      });
      return detailButton;
    }

    function renderTaskRowDetails(task) {
      const container = document.createElement("div");
      container.className = "task-row-details";

      const notes = document.createElement("dl");
      notes.className = "task-supplemental-notes";
      [
        ["title", task.title],
        ["submission_note", task.submission_note],
        ["caution_note", task.caution_note]
      ].forEach(function(item) {
        if (!item[1]) {
          return;
        }
        const term = document.createElement("dt");
        term.textContent = item[0];
        const description = document.createElement("dd");
        description.textContent = item[1];
        notes.appendChild(term);
        notes.appendChild(description);
      });
      container.appendChild(notes);

      const evidenceContainer = document.createElement("div");
      evidenceContainer.className = "task-evidence-detail-container";
      container.appendChild(evidenceContainer);
      return container;
    }

    function toggleTaskDetails(task, button) {
      const row = button.closest("tr");
      const detailRow = row ? row.nextElementSibling : null;
      if (!detailRow || !detailRow.classList.contains("task-detail-row")) {
        return;
      }

      const shouldOpen = detailRow.hidden;
      detailRow.hidden = !shouldOpen;
      button.textContent = shouldOpen ? "hide" : "details";
      if (!shouldOpen) {
        return;
      }

      const container = detailRow.querySelector(".task-evidence-detail-container");
      if (task.evidence_detail_url && container && !container.dataset.loaded) {
        loadTaskEvidenceDetails(task.evidence_detail_url, container, button);
      }
    }

    function renderTaskGuidance(task) {
      const guidanceItems = [
        ["やること", task.description],
        ["期限メモ", task.deadline_note],
        ["提出メモ", task.submission_note],
        ["注意", task.caution_note]
      ].filter(function(item) {
        return item[1];
      });

      if (guidanceItems.length === 0) {
        return null;
      }

      const container = document.createElement("dl");
      container.className = "task-guidance";
      guidanceItems.forEach(function(item) {
        const term = document.createElement("dt");
        term.textContent = item[0];
        const description = document.createElement("dd");
        description.textContent = item[1];
        container.appendChild(term);
        container.appendChild(description);
      });
      return container;
    }

    function renderTaskEvidence(task) {
      const evidenceItems = task.evidence;
      const omittedCount = task.evidence_omitted_count;
      if (!Array.isArray(evidenceItems) || evidenceItems.length === 0) {
        return null;
      }

      const container = document.createElement("div");
      container.className = "task-evidence";

      const title = document.createElement("p");
      title.className = "task-evidence-title";
      title.textContent = "根拠";
      container.appendChild(title);

      const list = document.createElement("ul");
      list.className = "task-evidence-list";
      evidenceItems.forEach(function(evidence) {
        const item = document.createElement("li");
        item.className = "task-evidence-item";
        item.dataset.evidenceType = evidence.type || "unknown";
        item.textContent = [
          evidence.type || "unknown",
          evidence.label || "",
          evidence.confidence ? "confidence: " + evidence.confidence : ""
        ].filter(Boolean).join(" / ");
        list.appendChild(item);
      });

      container.appendChild(list);
      if (task.evidence_detail_url) {
        const detailButton = document.createElement("button");
        detailButton.type = "button";
        detailButton.className = "task-evidence-detail-button";
        detailButton.textContent = "details";
        detailButton.addEventListener("click", function() {
          loadTaskEvidenceDetails(task.evidence_detail_url, container, detailButton);
        });
        container.appendChild(detailButton);
      }
      if (omittedCount > 0) {
        const omitted = document.createElement("p");
        omitted.className = "task-evidence-omitted";
        omitted.textContent = omittedCount + "件の根拠を省略";
        container.appendChild(omitted);
      }
      return container;
    }

    async function loadTaskEvidenceDetails(url, container, button) {
      button.disabled = true;
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const data = await response.json();
        renderTaskEvidenceDetails(container, data.evidence || []);
        container.dataset.loaded = "true";
        button.disabled = false;
      } catch (error) {
        taskError.textContent = "evidence details 繧貞叙蠕励〒縺阪∪縺帙ｓ縺ｧ縺励◆: " + error.message;
        button.disabled = false;
      }
    }

    function renderTaskEvidenceDetails(container, evidenceItems) {
      const existing = container.querySelector(".task-evidence-detail-list");
      if (existing) {
        existing.remove();
      }

      const list = document.createElement("ul");
      list.className = "task-evidence-detail-list";
      evidenceItems.forEach(function(evidence) {
        const item = document.createElement("li");
        item.className = "task-evidence-detail-item";
        item.textContent = [
          evidence.type || "unknown",
          evidence.label || "",
          evidence.source || "",
          evidence.confidence ? "confidence: " + evidence.confidence : ""
        ].filter(Boolean).join(" / ");
        list.appendChild(item);
      });
      container.appendChild(list);
    }

    async function updateTaskStatus(taskId, status, control) {
      if (!taskId) {
        taskError.textContent = "課題IDが見つかりません。";
        return;
      }

      taskError.textContent = "";
      if (control) {
        control.disabled = true;
      }

      try {
        const response = await fetch("/api/tasks/" + encodeURIComponent(taskId) + "/status", {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ status: status })
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        await loadTaskList();
      } catch (error) {
        taskError.textContent = "status を変更できませんでした: " + error.message;
        if (control) {
          control.disabled = false;
        }
      }
    }

    function appendTaskMeta(parent, label, value) {
      const item = document.createElement("span");
      item.className = "task-meta-item";
      item.textContent = label + ": " + value;
      parent.appendChild(item);
    }

    questionInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        ask();
      }
    });

    searchQueryInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        searchMoocs();
      }
    });

    function renderSources(sources, targetArea, headingText) {
      const area = targetArea || sourcesArea;
      area.textContent = "";

      if (!Array.isArray(sources) || sources.length === 0) {
        return;
      }

      if (headingText !== null) {
        const title = document.createElement("h3");
        title.className = "sources-title";
        title.textContent = headingText || "参照データ";
        area.appendChild(title);
      }

      const list = document.createElement("ol");
      list.className = "sources-list";

      sources.forEach(function(source) {
        const item = document.createElement("li");
        item.className = "source-item source-item-" + (source.type || "unknown");

        const badge = document.createElement("span");
        badge.className = "type-badge type-badge-" + (source.type || "unknown");
        badge.textContent = typeLabel(source.type);

        const heading = document.createElement("p");
        heading.className = "source-heading";
        heading.textContent = source.title || "タイトル未設定";

        const meta = document.createElement("dl");
        meta.className = "source-meta-list";
        appendMeta(meta, "type", source.type || "未設定");
        appendMeta(meta, "course_code", source.course_code || "未設定");
        appendMeta(meta, "lecture_title", source.lecture_title || "未設定");

        const excerptText = source.snippet || source.content_excerpt;
        let excerpt = null;
        if (excerptText) {
          excerpt = document.createElement("p");
          excerpt.className = "source-snippet";
          excerpt.textContent = excerptText;
        }

        if (source.source_url) {
          const urlRow = document.createElement("div");
          urlRow.className = "source-url-row";

          const label = document.createElement("span");
          label.className = "source-url-label";
          label.textContent = "source_url";

          const link = document.createElement("a");
          link.href = source.source_url;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = source.source_url;

          urlRow.appendChild(label);
          urlRow.appendChild(link);
          item.appendChild(badge);
          item.appendChild(heading);
          item.appendChild(meta);
          if (excerpt) {
            item.appendChild(excerpt);
          }
          item.appendChild(urlRow);
        } else {
          item.appendChild(badge);
          item.appendChild(heading);
          item.appendChild(meta);
          if (excerpt) {
            item.appendChild(excerpt);
          }
        }

        list.appendChild(item);
      });

      area.appendChild(list);
    }

    function appendMeta(parent, label, value) {
      const term = document.createElement("dt");
      term.textContent = label;
      const description = document.createElement("dd");
      description.textContent = value;
      parent.appendChild(term);
      parent.appendChild(description);
    }

    function typeLabel(type) {
      const labels = {
        course: "course",
        lecture: "lecture",
        task: "課題",
        page: "page",
        material: "material"
      };
      return labels[type] || (type || "unknown");
    }
  </script>
</body>
</html>
