services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aio_user:aio_password@db:5432/aio_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aio_password}
      POSTGRES_DB: ${POSTGRES_DB:-aio_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aio_user} -d ${POSTGRES_DB:-aio_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
